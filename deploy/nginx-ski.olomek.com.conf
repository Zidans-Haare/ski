# Nur für ski.olomek.com. Andere Seiten (z. B. biertest) bleiben unberührt.
server {
    listen 80;
    server_name ski.olomek.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ski-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ski.olomek.com;

    ssl_certificate /etc/letsencrypt/live/ski.olomek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ski.olomek.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
